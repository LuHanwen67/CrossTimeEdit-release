# Main CrossTimeEdit online RL configuration.
# Each epoch uses 50 prompts with 8 rollouts per prompt.
launcher: accelerate
num_processes: 4
main_process_port: 29515
mixed_precision: bf16

data:
  datasets:
    - name: streetview_change_gt
      dataset_dir: data/rl
      train:
        weight: 1
      eval: {}
  preprocessing_batch_size: 8
  dataloader_num_workers: 4
  force_reprocess: false
  cache_dir: outputs/cache/rl_main
  sampler_type: group_contiguous

model:
  finetune_type: lora
  master_weight_dtype: fp32
  lora_rank: 32
  lora_alpha: 32
  target_modules:
    - attn.to_q
    - attn.to_k
    - attn.to_v
    - attn.to_out.0
    - attn.add_q_proj
    - attn.add_k_proj
    - attn.add_v_proj
    - attn.to_add_out
    - single_transformer_blocks.0.attn.to_out
    - single_transformer_blocks.1.attn.to_out
    - single_transformer_blocks.2.attn.to_out
    - single_transformer_blocks.3.attn.to_out
    - single_transformer_blocks.4.attn.to_out
    - single_transformer_blocks.5.attn.to_out
    - single_transformer_blocks.6.attn.to_out
    - single_transformer_blocks.7.attn.to_out
    - single_transformer_blocks.8.attn.to_out
    - single_transformer_blocks.9.attn.to_out
    - single_transformer_blocks.10.attn.to_out
    - single_transformer_blocks.11.attn.to_out
    - single_transformer_blocks.12.attn.to_out
    - single_transformer_blocks.13.attn.to_out
    - single_transformer_blocks.14.attn.to_out
    - single_transformer_blocks.15.attn.to_out
    - single_transformer_blocks.16.attn.to_out
    - single_transformer_blocks.17.attn.to_out
    - single_transformer_blocks.18.attn.to_out
    - single_transformer_blocks.19.attn.to_out
  model_name_or_path: models/FLUX.2-klein-base-4B
  model_type: flux2-klein
  resume_path: weights/sft/v3_e9_lora
  resume_type: lora
  reference_from_resume: true

train:
  trainer_type: grpo
  advantage_aggregation: gdpo
  clip_range: 1.0e-3
  adv_clip_range: 5.0
  kl_type: v-based
  kl_beta: 2.0e-3
  ref_param_device: cuda
  resolution: [384, 768]
  condition_image_size: [384, 768]
  num_inference_steps: 10
  guidance_scale: 1.0
  per_device_batch_size: 1
  group_size: 8
  global_std: false
  unique_sample_num_per_epoch: 50
  gradient_step_per_epoch: 2
  gradient_accumulation_steps: auto
  max_epochs: 200
  learning_rate: 7.5e-6
  adam_weight_decay: 1.0e-4
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  enable_gradient_checkpointing: true
  offload_samples_to_cpu: true
  ema_decay: 0
  seed: 42

scheduler:
  dynamics_type: Flow-SDE
  noise_level: 0.7
  num_sde_steps: 1
  sde_steps: [1, 2, 3]
  seed: 42

eval:
  resolution: [512, 1024]
  condition_image_size: [512, 1024]
  per_device_batch_size: 1
  seed: 42
  guidance_scale: 1.0
  num_inference_steps: 30
  eval_freq: 0

rewards:
  - name: gemini_ia
    reward_model: flow_factory.rewards.streetview_gemini_reward.StreetviewGeminiRewardModel
    weight: 0.45
    batch_size: 1
    device: cpu
    dtype: float32
    async_reward: true
    num_workers: 4
    dimension: ia_gt
    model: gemini-3.1-flash-lite
    max_output_tokens: 256
    timeout: 180
    retries: 3
    prompt_root: prompts/evaluation
  - name: gemini_bp
    reward_model: flow_factory.rewards.streetview_gemini_reward.StreetviewGeminiRewardModel
    weight: 0.3
    batch_size: 1
    device: cpu
    dtype: float32
    async_reward: true
    num_workers: 4
    dimension: bp
    model: gemini-3.1-flash-lite
    max_output_tokens: 96
    timeout: 180
    retries: 3
    prompt_root: prompts/evaluation
  - name: gemini_qp
    reward_model: flow_factory.rewards.streetview_gemini_reward.StreetviewGeminiRewardModel
    weight: 0.25
    batch_size: 1
    device: cpu
    dtype: float32
    async_reward: true
    num_workers: 4
    dimension: qp
    model: gemini-3.1-flash-lite
    max_output_tokens: 96
    timeout: 180
    retries: 3
    prompt_root: prompts/evaluation

log:
  run_name: crosstimeedit_rl
  project: CrossTimeEdit
  logging_backend: none
  save_dir: outputs/rl
  # Save a complete Accelerate state every five epochs.
  save_freq: 5
  save_model_only: false
